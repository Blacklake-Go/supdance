# Include inside the HTTPS server for www.supdance.com.
location ~ ^/openai-plugin/(support|privacy|terms)$ {
    alias /opt/supdance-openai-plugin/public/$1.html;
    default_type text/html;
    charset utf-8;
}

location = /openai-plugin/review-demo.mp4 {
    alias /opt/supdance-openai-plugin/public/review-demo.mp4;
    default_type video/mp4;
    add_header Cache-Control "public, max-age=3600";
}
