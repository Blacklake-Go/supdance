# Include from the Supdance HTTPS server block. If using a separate web origin,
# place only the /supdance-studio locations in that origin's server block.
location = /mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 105s;
    client_max_body_size 512000;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
}
location = /supdance-studio {
    return 308 /supdance-studio/;
}
location ^~ /supdance-studio/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 105s;
    client_max_body_size 512000;
    # OAuth authorization codes and state appear in callback query strings.
    access_log off;
}
